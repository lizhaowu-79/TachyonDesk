name: Release (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify UI translation table
        shell: pwsh
        run: |
          python viewer/uitext/gen.py
          git diff --exit-code viewer/UiTextTable.inc

      - name: Build TachyonDesk (Release | x64)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Package portable release archive
        id: package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $stageName = "TachyonDesk-$tag-win-x64"
          $stage = Join-Path "dist" $stageName
          New-Item -ItemType Directory -Force $stage | Out-Null

          # Copy executables and runtime DLLs (exclude internal test helper if desired)
          Copy-Item "build\bin\x64\Release\TachyonViewer.exe" $stage
          Copy-Item "build\bin\x64\Release\TachyonServer.exe" $stage
          Copy-Item "build\bin\x64\Release\TachyonRepeater.exe" $stage
          Copy-Item "build\bin\x64\Release\TachyonSettings.exe" $stage
          Copy-Item "build\bin\x64\Release\TachyonKeyboardHelper.exe" $stage
          Copy-Item "build\bin\x64\Release\createpassword.exe" $stage
          Copy-Item "build\bin\x64\Release\MSLogonACL.exe" $stage
          Copy-Item "build\bin\x64\Release\*.dll" $stage
          Copy-Item "LICENSE", "README.md", "README_CN.md", "PORTABLE_MODE.md", "SECURITY.md" $stage

          $zipPath = Join-Path "dist" "$stageName.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $stageName.zip" | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii -NoNewline

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            dist/SHA256SUMS.txt
